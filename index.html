<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Code Scanner - Demo</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body class="bg-slate-100 flex min-h-dvh">
        <header class="bg-black fixed h-16 text-white w-full z-50">
            <nav class="flex h-full items-center justify-center">
                <a href="/">HOME</a>
            </nav>
        </header>
        <main class="flex flex-1 pt-16 relative">
            <section
                id="main"
                class="flex flex-1 items-center visible justify-center"
            >
                <button
                    id="start"
                    class="bg-blue-500 cursor-pointer h-16 rounded-xl text-white w-1/2"
                >
                    Start scan
                </button>
            </section>
            <section
                id="result"
                class="absolute bottom-0 flex flex-col inset-x-0 items-center invisible justify-center px-6 top-16"
            >
                <p
                    class="bg-slate-300 flex h-12 items-center justify-center rounded-xl w-full"
                >
                    null
                </p>
                <div class="flex flex-col gap-4 mt-16 w-fit">
                    <div class="flex gap-4">
                        <button
                            id="restart"
                            class="bg-black cursor-pointer px-6 py-3 rounded-xl text-white"
                        >
                            Restart
                        </button>
                        <button
                            id="add"
                            class="bg-blue-500 cursor-pointer px-6 py-3 rounded-xl text-white"
                        >
                            Add
                        </button>
                    </div>
                    <button
                        id="delete"
                        class="bg-red-700 cursor-pointer px-6 py-3 rounded-xl text-white"
                    >
                        Delete all
                    </button>
                    <button
                        id="show"
                        class="border-2 cursor-pointer px-6 py-3 rounded-xl"
                    >
                        Show code list
                    </button>
                </div>
                <dialog
                    id="codeList"
                    class="absolute h-2/3 inset-0 m-auto max-h-2/3 p-4 rounded-xl shadow-xl w-4/5 backdrop:bg-black/75 backdrop:backdrop-blur-lg"
                >
                    <div
                        class="flex flex-col h-full items-center justify-between max-h-full"
                    >
                        <div class="flex flex-col overflow-hidden w-full">
                            <h3 class="mb-8">Saved codes</h3>
                            <ul class="mb-16 overflow-y-scroll">
                                <li>test</li>
                            </ul>
                        </div>
                        <button
                            id="closeList"
                            class="bg-black cursor-pointer px-4 py-2 rounded-xl text-white w-fit"
                        >
                            Close
                        </button>
                    </div>
                </dialog>
            </section>
            <section
                id="CodeScanner"
                class="absolute bottom-0 inset-x-0 top-16 invisible"
            ></section>
        </main>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
